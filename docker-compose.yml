version: '3.8'

services:
  vulnseal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnseal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/vulnseal.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - vulnseal_data:/app/data

volumes:
  vulnseal_data:
