name: VulnSeal CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Lint & Verify Security Agents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Codebase (TypeScript)
        run: npm run lint

      - name: Build Application (Frontend & Server)
        run: npm run build

      - name: Run Python Backend Automated Verification Suite
        run: python3 -m backend.test_suite
