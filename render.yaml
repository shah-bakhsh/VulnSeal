services:
  - type: web
    name: vulnseal
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/workspaces
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
